# G1 Deploy - Observation Configuration
# ====================================
# Total dimension: 436 (64+12+116+116+116+12)

observations:

  - name: "token_state"
    enabled: true

  - name: "his_base_angular_velocity_10frame_step1"
    enabled: true
    
  - name: "his_body_joint_positions_10frame_step1"
    enabled: true
    
  - name: "his_body_joint_velocities_10frame_step1"
    enabled: true
    
  - name: "his_last_actions_10frame_step1"
    enabled: true

  - name: "his_gravity_dir_10frame_step1"
    enabled: true

encoder:
  dimension: 64
  use_fp16: false
  encoder_observations:
    - name: "encoder_mode_4"
      enabled: true
    - name: "motion_joint_positions_10frame_step5"
      enabled: true
    - name: "motion_joint_velocities_10frame_step5"
      enabled: true
    - name: "motion_root_z_position_10frame_step5"
      enabled: true
    - name: "motion_root_z_position"
      enabled: true
    - name: "motion_anchor_orientation"
      enabled: true
    - name: "motion_anchor_orientation_10frame_step5"
      enabled: true
    - name: "motion_joint_positions_lowerbody_10frame_step5"
      enabled: true
    - name: "motion_joint_velocities_lowerbody_10frame_step5"
      enabled: true
    - name: "vr_3point_local_target"
      enabled: true
    - name: "vr_3point_local_orn_target"
      enabled: true
    - name: "smpl_joints_10frame_step1"
      enabled: true
    - name: "smpl_anchor_orientation_10frame_step1" 
      enabled: true
    - name: "motion_joint_positions_wrists_10frame_step1" 
      enabled: true
  encoder_modes:
    - name: "g1"
      mode_id: 0
      required_observations:
        - encoder_mode_4
        - motion_joint_positions_10frame_step5
        - motion_joint_velocities_10frame_step5
        - motion_anchor_orientation_10frame_step5
    - name: "teleop"
      mode_id: 1
      required_observations:
        - encoder_mode_4
        - motion_joint_positions_lowerbody_10frame_step5
        - motion_joint_velocities_lowerbody_10frame_step5
        - vr_3point_local_target
        - vr_3point_local_orn_target
        - motion_anchor_orientation
    - name: "smpl"
      mode_id: 2
      required_observations:
        - encoder_mode_4
        - smpl_joints_10frame_step1
        - smpl_anchor_orientation_10frame_step1
        - motion_joint_positions_wrists_10frame_step1

# Optional residual MLP between encoder and decoder.
# When enabled, also pass --residual-model path/to/model_residual.onnx on the command line
# (deploy.sh loads policy/release/model_residual.onnx by default for both sim and real).
# At runtime: token_state += residual_output * 0.2 before the decoder.
# Keyboard Y/y toggles residual correction (default OFF when the stack loads).
# The elevation map ROS2 topic is fixed in code (kResidualElevationMapTopic = "/elevation_map").
# Controller converts absolute ground_z → policy height via TF torso_link Z:
#   policy_height = sensor_z - ground_z - 0.5  (see Ros2ElevationCache).
residual:
  enabled: true
  use_fp16: false
  last_delta_z_step_dimension: 64
  # Height map grid: H x W. Training format is (T, H, W) elevation history.
  # Grid must match the elevation publisher. Set to 15x15 to match training.
  height_scanner_row_count: 15
  height_scanner_column_count: 15
  # Number of historical elevation frames encoded into height_map_2d_history5 (must match ONNX).
  height_scanner_history_steps: 5
  # Control ticks between height-map history pushes (must match training update_period / step_dt).
  # 5 @ 50 Hz control → 10 Hz, matching Intentele height_scanner.update_period.
  height_map_refresh_interval: 5
