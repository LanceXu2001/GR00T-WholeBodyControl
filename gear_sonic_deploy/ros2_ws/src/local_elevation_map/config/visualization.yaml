grid_map_visualization:
  ros__parameters:
    grid_map_topic: /elevation_map
    grid_map_visualizations: [elevation_points, elevation_grid]
    elevation_points:
      type: point_cloud
      params:
        layer: elevation
    elevation_grid:
      type: occupancy_grid
      params:
        layer: elevation
        data_min: -1.0
        data_max: 2.0
